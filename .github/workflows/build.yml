name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Create project files
        shell: python
        run: |
          import pathlib
          pathlib.Path("app/src/main/java/com/example/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          pathlib.Path("settings.gradle").write_text('''
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          ''')
          pathlib.Path("build.gradle").write_text("plugins { id 'com.android.application' version '8.1.4' apply false }")
          pathlib.Path("app/build.gradle").write_text('''
          plugins { id 'com.android.application' }
          android {
            namespace 'com.example.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.example.user2finder"
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName "2.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {}
          ''')
          pathlib.Path("app/src/main/res/values/strings.xml").write_text('<resources><string name="app_name">User2Finder</string></resources>')
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('''
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.MANAGE_USERS" />
            <uses-permission android:name="android.permission.INTERACT_ACROSS_USERS" />
            <application android:label="User2Finder">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          ''')
          pathlib.Path("app/src/main/java/com/example/app/MainActivity.java").write_text('''
          package com.example.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.UserManager;
          import android.widget.TextView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.content.Context;
          import java.util.List;
          import java.lang.reflect.Method;

