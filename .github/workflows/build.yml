name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create project
        run: |
          rm -rf app build .gradle gradle
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/values
          
          cat > settings.gradle <<'END'
          include ':app'
          END
          
          cat > build.gradle <<'END'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          END
          
          cat > app/build.gradle <<'END'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.example.app'
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.example.user2finder"
                  minSdkVersion 24
                  targetSdkVersion 33
                  versionCode 12
                  versionName "2.7"
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
          }
          END
          
          echo '<resources><string name="app_name">User2Finder</string
