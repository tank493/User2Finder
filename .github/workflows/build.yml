name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Create files
        run: |
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          END
          cat > build.gradle <<'END'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          END
          cat > app/build.gradle <<'END'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.user2finder"
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName "2.5"
              }
          }
          END
          echo '<resources><string name="app_name">User2Finder</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="User2Finder"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/example/app/MainActivity.java <<'END'
          package com.example.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import android.content.Intent;
          import android.view.View;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout layout = new Linear
