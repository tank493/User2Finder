name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create files
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/values
          
          cat > settings.gradle <<'END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          END
          
          cat > build.gradle <<'END'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          END
          
          cat > app/build.gradle <<'END'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.user2finder"
                  minSdk 24
                  targetSdk 33
                  versionCode 13
                  versionName "2.8"
              }
          }
          END
          
          echo '<resources><string name="app_name">User2Finder</string></resources>' > app/src/main/res/values/strings.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="User2Finder"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          cat > app/src/main/java/com/example/app/MainActivity.java <<'END'
          package com.example.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import android.content.Intent;
          import android.view.View;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 60, 40, 40);
                  TextView t = new TextView(this);
                  t.setText("User2Finder v2.8");
                  layout.addView(t);
                  Button btn = new Button(this);
                  btn.setText("Deschide Useri Ascunsi");
                  layout.addView(btn);
                  final TextView res = new TextView(this);
                  layout.addView(res);
                  btn.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          try {
                              Intent i = new Intent();
                              i.setClassName("com.android.settings", "com.android.settings.Settings$UserSettingsActivity");
                              startActivity(i);
                          } catch (Exception e) {
                              try {
                                  startActivity(new Intent("android.settings.USER_SETTINGS"));
                              } catch (Exception e2) {
                                  res.setText("Blocat - foloseste Activity Launcher");
                              }
                          }
                      }
                  });
                  setContentView(layout);
              }
          }
          END
          
      - name: Build APK
        run: |
          gradle :app:clean :app:assembleDebug --no-daemon --rerun-tasks --stacktrace
          
      - name: Find APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          find . -name "*.apk"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: User2Finder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
