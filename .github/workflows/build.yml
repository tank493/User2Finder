name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: |
          python3 << 'PY'
          import pathlib
          pathlib.Path("app/src/main/java/com/example/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          open("settings.gradle","w").write("""
         
