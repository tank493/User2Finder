name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Create project files
        shell: python
        run: |
          import pathlib
          pathlib.Path("app/src/main/java/com/example/app").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          pathlib.Path("settings.gradle").write_text('''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google(); mavenCentral() } }
          include ':app'
          ''')
          pathlib.Path("build.gradle").write_text("plugins { id 'com.android.application' version '8.1.4' apply false }")
          pathlib.Path("app/build.gradle").write_text('''
          plugins { id 'com.android.application' }
          android {
            namespace 'com.example.app'
            compileSdk 34
            defaultConfig { applicationId "com.example.user2finder" minSdk 24 targetSdk 34 versionCode 3 versionName "2.1" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {}
          ''')
          pathlib.Path("app/src/main/res/values/strings.xml").write_text('<resources><string name="app_name">User2Finder</string></resources>')
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('''
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="User2Finder">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          ''')
          pathlib.Path("app/src/main/java/com/example/app/MainActivity.java").write_text('''
          package com.example.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.*;
          import android.content.Intent;
          import android.view.View;
          import android.widget.Toast;

          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout layout = new LinearLayout(this);
              layout.setOrientation(LinearLayout.VERTICAL);
              layout.setPadding(40,60,40,40);
              
              TextView title = new TextView(this);
              title.setText("User2Finder v2.1\\nDeschide functia ascunsa\\n\\n");
              title.setTextSize(20);
              layout.addView(title);
              
              Button btn1 = new Button(this);
              btn1.setText("1. Deschide Meniu Useri Ascuns");
              layout.addView(btn1);
              
              Button btn2 = new Button(this);
              btn2.setText("2. Deschide Setari Utilizatori (metoda 2)");
              layout.addView(btn2);
              
              Button btn3 = new Button(this);
              btn3.setText("3. Incearca sa creezi User 2 direct");
              layout.addView(btn3);
              
              TextView result = new TextView(this);
              result.setTextSize(14);
              result.setPadding(0,30,0,0);
              layout.addView(result);
              
              btn1.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  try {
                    Intent i = new Intent();
                    i.setClassName("com.android.settings", "com.android.settings.Settings$UserSettingsActivity");
                    startActivity(i);
                  } catch (Exception e) {
                    result.setText("Metoda 1 blocata: " + e.getMessage() + "\\nIncerc metoda 2...");
                    try {
                      Intent i2 = new Intent("android.settings.USER_SETTINGS");
                      startActivity(i2);
                    } catch (Exception e2) {
                      result.setText("Telefonul blocheaza functia.\\nProducatorul a ascuns-o complet.\\n\\nIncearca metoda 3 sau cauta in Setari: 'Utilizatori multipli'");
                    }
                  }
                }
              });
              
              btn2.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  try {
                    Intent i = new Intent(android.provider.Settings.ACTION_USER_DICTIONARY_SETTINGS);
                    startActivity(i);
                  } catch (Exception e) {
                    try {
                      Intent i = new Intent();
                      i.setAction("android.settings.USERS_SETTINGS");
                      startActivity(i);
                    } catch (Exception e2) {
                      Toast.makeText(MainActivity.this, "Nu se poate deschide", 1).show();
                    }
                  }
                }
              });
              
              btn3.setOnClickListener(new View.OnClickListener() {
                public void onClick(View v) {
                  result.setText("Pentru a crea User 2 manual:\\n\\n1. Deschide aplicatia Telefon (dialer)\\n2. Tasteaza: *#*#8255#*#* sau *#*#4636#*#*\\n3. Sau mergi la Setari > Despre telefon > Apasa de 7 ori pe Versiune\\n\\nDaca nu merge, spune-mi ce marca de telefon ai (Xiaomi/Samsung/Huawei) si iti fac cod special pentru marca ta.");
                }
              });
              
              ScrollView sv = new ScrollView(this);
              sv.addView(layout);
              setContentView(sv);
            }
          }
          ''')
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: user2finder-v21
          path: app/build/outputs/apk/debug/*.apk
